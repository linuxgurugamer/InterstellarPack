//	Bueshift uses Graviolium:
//		Increase consumption
//		Increase startup cost
//		Penalize small ships

//Effect
//	Warp becomes a logistics decision
//	Small probes can’t trivialize interstellar travel
//	Colonies must support Graviolium supply

@PART:HAS[@MODULE[WBIWarpEngine]]:NEEDS[NearFutureElectrical,NearFuturePropulsion,!InterstellarFuelSwitch]:AFTER[Blueshift]
{
  @MODULE[WBIWarpEngine]
  {
    // Increase cost per second
    @gravioliumConsumptionRate *= 2.5

    // Increase jump startup cost
    @startupCost *= 3

    // Prevent tiny ships from abusing warp
    %minimumWarpMass = 150
  }
}

