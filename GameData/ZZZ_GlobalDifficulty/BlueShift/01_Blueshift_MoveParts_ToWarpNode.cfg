// Moves all warp engines/cores to your new node so it unlocks in-step with NF reactor maturity.
//
// GameData/ZZZ_InterstellarPack/01_Blueshift_MoveParts_ToWarpNode.cfg

// Warp engines/cores use WBIWarpEngine.
// Put them into ct_warpFieldTheory when CTT is present.
@PART:HAS[@MODULE[WBIWarpEngine]]:NEEDS[Blueshift,CommunityTechTree]:AFTER[Blueshift]
{
  @TechRequired = ct_warpFieldTheory
  @entryCost *= 2
}

// If you want jumpgates/jump-tech separated and even later,
// you can optionally shove WBIJumpGate parts into ultraHighEnergyPhysics (10k node in many CTT trees) :contentReference[oaicite:3]{index=3}
@PART:HAS[@MODULE[WBIJumpGate]]:NEEDS[Blueshift,CommunityTechTree]:AFTER[Blueshift]
{
  @TechRequired = ultraHighEnergyPhysics
  @entryCost *= 2
}

