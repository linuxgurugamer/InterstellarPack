// Creates a new CTT node ct_warpFieldTheory that sits after big NFE reactors (veryHeavyRocketry) and the advanced-electrics branch (experimentalElectrics), and adds richer descriptions.
//
// GameData/ZZZ_InterstellarPack/00_WarpNode_CTT.cfg

@TechTree:NEEDS[CommunityTechTree]:AFTER[CommunityTechTree]
{
  // New node: Warp Field Theory
  RDNode
  {
    id = ct_warpFieldTheory
    title = Warp Field Theory
    description = You can bend spacetime. Now the hard part: doing it without melting the ship. Requires serious reactor power, heat rejection, and disciplined field control.
    cost = 12000
    hideEmpty = False
    nodeName = ct_warpFieldTheory
    anyToUnlock = False
    icon = RDicon_science-experimental
    // Position is arbitrary; adjust if you care about the layout
    pos = -200,1600,-1
    scale = 0.6

    // Align with Near Future Electrical: small reactors show at experimentalElectrics,
    // large reactors show at veryHeavyRocketry in many installs/listings.
    // Gate warp behind both.
    Parent
    {
      parentID = experimentalElectrics
      lineFrom = RIGHT
      lineTo = LEFT
    }
    Parent
    {
      parentID = veryHeavyRocketry
      lineFrom = RIGHT
      lineTo = LEFT
    }
  }

  // Optional: Improve some ultra-late CTT node descriptions (pure text changes)
  @RDNode:HAS[#id[ct_unifiedFieldTheory]]
  {
    @description = Unified field control: a single framework to describe—and manipulate—fundamental forces. Useful for exotic propulsion, containment, and the first truly controllable spacetime experiments.
  }

  @RDNode:HAS[#id[ultraHighEnergyPhysics]]
  {
    @description = Ultra-high energy physics: where the lab equipment starts to resemble a spaceship. Ideal for pushing exotic propulsion and field effects beyond “theoretical.”
  }
}

