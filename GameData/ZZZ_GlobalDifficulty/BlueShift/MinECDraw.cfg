// Make power requirements brutal (Near Future friendly)
// Add a minimum EC draw that forces real reactors.
//
//	Small solar arrays → useless
//	NFE reactors → mandatory
//	Radiator planning → required

@PART:HAS[@MODULE[WBIWarpEngine]]:NEEDS[NearFutureElectrical,NearFuturePropulsion,!InterstellarFuelSwitch]:AFTER[Blueshift]
{
  @MODULE[WBIWarpEngine]
  {
    %minimumECRequirement = 500000
  }
}

