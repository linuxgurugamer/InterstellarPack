// GameData/ZZZ_Sterling_Tuning/31_EnginesFusion_EngineerEfficiency.cfg
// (Optional: include this file if you want the crew-skill behavior)

@PART:HAS[@MODULE[ModuleEngines*]]:NEEDS[SterlingSystemsEnginesFusion]:AFTER[SterlingSystemsEnginesFusion]
{
  MODULE
  {
    name = ModuleResourceConverter
    ConverterName = Fusion Feed Optimization
    StartActionName = Start Feed Optimization
    StopActionName  = Stop Feed Optimization
    AutoShutdown = false
    GeneratesHeat = false

    UseSpecialistBonus = true
    Specialty = Engineer
    SpecialistEfficiencyFactor = 0.05
    SpecialistBonusBase = 0.90

    INPUT_RESOURCE
    {
      ResourceName = ElectricCharge
      Ratio = 5
    }
    OUTPUT_RESOURCE
    {
      ResourceName = FusionPellets
      Ratio = 0.0005
      DumpExcess = false
    }
  }
}

