// GameData/ZZZ_Sterling_Tuning/21_EnginesThermalNozzle_Tuning.cfg

@PART:HAS[@MODULE[ModuleEngines*]]:NEEDS[SterlingSystemsEnginesThermalNozzle]:AFTER[SterlingSystemsEnginesThermalNozzle]
{
  @MODULE[ModuleEngines*]
  {
    @PROPELLANT[ThermalPower] { @ratio *= 1.20 }
    @PROPELLANT[LqdHydrogen]  { @ratio *= 1.08 }
    @PROPELLANT[Hydrogen]     { @ratio *= 1.08 }
  }
}

