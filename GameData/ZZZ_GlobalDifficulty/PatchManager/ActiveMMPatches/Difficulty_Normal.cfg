// GameData/ZZZ_GlobalDifficulty/Extras/GlobalDifficulty_Normal.cfg

// BLUESHIFT
@PART:HAS[@MODULE[WBIWarpEngine]]:NEEDS[Blueshift]:AFTER[Blueshift]
{
  @MODULE[WBIWarpEngine]
  {
    // leave consumption as tuned in your Blueshift patch pack
    %minimumWarpMass = 150
    @warpSpeedSkillMultiplier *= 1.00
  }
}

// STERLING fuel cells baseline (no extra change beyond your Sterling tuning pack)
@PART:HAS[@MODULE[ModuleResourceConverter]]:NEEDS[SterlingSystemsElectricsFuelCell]:AFTER[SterlingSystemsElectricsFuelCell]
{
  @MODULE[ModuleResourceConverter]
  {
    @OUTPUT_RESOURCE:HAS[#ResourceName[ElectricCharge]] {}
    @INPUT_RESOURCE,* { @Ratio *= 1.00 }
    @SpecialistEfficiencyFactor *= 1.00
  }
}

// STERLING engines baseline
@PART:HAS[@MODULE[ModuleEngines*]]:NEEDS[SterlingSystemsEnginesFission|SterlingSystemsEnginesThermalNozzle|SterlingSystemsEnginesFusion|SterlingSystemsEnginesAntimatter]:AFTER[SterlingSystemsEnginesFusion]
{
  @MODULE[ModuleEngines*]
  {
    @PROPELLANT[FusionPellets] { @ratio *= 1.00 }
    @PROPELLANT[Antimatter]    { @ratio *= 1.00 }
    @PROPELLANT[ThermalPower]  { @ratio *= 1.00 }
  }
}

// LIFE SUPPORT baseline: no extra changes beyond whatever LS you installed (and your separate LS patches, if any)
