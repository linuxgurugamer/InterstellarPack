// GameData/ZZZ_GlobalDifficulty/Extras/GlobalDifficulty_Hard.cfg

//////////////////////
// BLUESHIFT
//////////////////////
@PART:HAS[@MODULE[WBIWarpEngine]]:NEEDS[Blueshift]:AFTER[Blueshift]
{
  @MODULE[WBIWarpEngine]
  {
    @gravioliumConsumptionRate *= 1.35
    @startupCost *= 1.50
    %minimumWarpMass = 300

    // Crew still matters, but less of a magic bypass
    @warpSpeedSkillMultiplier *= 0.85
  }
}

//////////////////////
// STERLING ELECTRICS (Fuel Cells)
//////////////////////
@PART:HAS[@MODULE[ModuleResourceConverter]]:NEEDS[SterlingSystemsElectricsFuelCell]:AFTER[SterlingSystemsElectricsFuelCell]
{
  @MODULE[ModuleResourceConverter]
  {
    @OUTPUT_RESOURCE:HAS[#ResourceName[ElectricCharge]] {}
    @INPUT_RESOURCE,* { @Ratio *= 1.25 }

    @SpecialistEfficiencyFactor *= 0.85
    @SpecialistBonusBase = 0.80
  }
}

//////////////////////
// STERLING ENGINES
//////////////////////
@PART:HAS[@MODULE[ModuleEngines*]]:NEEDS[SterlingSystemsEnginesFission|SterlingSystemsEnginesThermalNozzle|SterlingSystemsEnginesFusion|SterlingSystemsEnginesAntimatter]:AFTER[SterlingSystemsEnginesFusion]
{
  @MODULE[ModuleEngines*]
  {
    @PROPELLANT[FusionPellets] { @ratio *= 1.20 }
    @PROPELLANT[Antimatter]    { @ratio *= 1.25 }
    @PROPELLANT[ThermalPower]  { @ratio *= 1.10 }
  }
}

//////////////////////
// LIFE SUPPORT
// Harder closed-loop: recyclers/greenhouses need more inputs for same output.
//////////////////////

