// GameData/ZZZ_GlobalDifficulty/Extras/GlobalDifficulty_Easy.cfg

//////////////////////
// BLUESHIFT (FTL)
//////////////////////
@PART:HAS[@MODULE[WBIWarpEngine]]:NEEDS[Blueshift]:AFTER[Blueshift]
{
  @MODULE[WBIWarpEngine]
  {
    @gravioliumConsumptionRate *= 0.70
    @startupCost *= 0.80
    %minimumWarpMass = 50

    // Crew helps more
    @warpSpeedSkillMultiplier *= 1.40
  }
}

//////////////////////
// STERLING ELECTRICS (Fuel Cells + PV)
// (Fuel cells: lower “fuel” input cost; PV left alone except your CTT placement patch)
//////////////////////
@PART:HAS[@MODULE[ModuleResourceConverter]]:NEEDS[SterlingSystemsElectricsFuelCell]:AFTER[SterlingSystemsElectricsFuelCell]
{
  @MODULE[ModuleResourceConverter]
  {
    @OUTPUT_RESOURCE:HAS[#ResourceName[ElectricCharge]] {}
    @INPUT_RESOURCE,* { @Ratio *= 0.90 }

    // If your other Sterling patches enabled specialist bonuses, make them matter more
    @SpecialistEfficiencyFactor *= 1.25
    @SpecialistBonusBase = 0.92
  }
}

//////////////////////
// STERLING ENGINES (Fission / ThermalNozzle / Fusion / Antimatter)
//////////////////////
@PART:HAS[@MODULE[ModuleEngines*]]:NEEDS[SterlingSystemsEnginesFission|SterlingSystemsEnginesThermalNozzle|SterlingSystemsEnginesFusion|SterlingSystemsEnginesAntimatter]:AFTER[SterlingSystemsEnginesFusion]
{
  @MODULE[ModuleEngines*]
  {
    // “Rare fuels” slightly cheaper
    @PROPELLANT[FusionPellets] { @ratio *= 0.90 }
    @PROPELLANT[Antimatter]    { @ratio *= 0.90 }

    // ThermalPower appetite slightly reduced
    @PROPELLANT[ThermalPower]  { @ratio *= 0.95 }
  }
}

//////////////////////
// LIFE SUPPORT (pick one; controller autodetects)
// Snacks: boost greenhouse/recycler outputs a bit (where converters exist)
//////////////////////
@PART:HAS[@MODULE[ModuleResourceConverter]]:NEEDS[Snacks]:AFTER[Snacks]
{
  @MODULE[ModuleResourceConverter]
  {
    @OUTPUT_RESOURCE:HAS[#ResourceName[Snacks]] {}
    // Easier closed-loop: less input for same Snacks output
    @INPUT_RESOURCE,* { @Ratio *= 0.90 }
  }
}

// USI-LS: easier supplies chain (converter-side)
@PART:HAS[@MODULE[ModuleResourceConverter]]:NEEDS[USILifeSupport]:AFTER[USILifeSupport]
{
  @MODULE[ModuleResourceConverter]
  {
    @OUTPUT_RESOURCE:HAS[#ResourceName[Supplies]] {}
    @INPUT_RESOURCE,* { @Ratio *= 0.90 }
  }
}

// IFI-LS: easier recycling (OrganicSlurry/Sludge → LifeSupport)
@PART:HAS[@MODULE[ModuleResourceConverter]]:NEEDS[IFILifeSupport]:AFTER[IFILifeSupport]
{
  @MODULE[ModuleResourceConverter]
  {
    @OUTPUT_RESOURCE:HAS[#ResourceName[LifeSupport]] {}
    @INPUT_RESOURCE,* { @Ratio *= 0.90 }
  }
}

// TAC-LS: easier recyclers (CO2→O2, WasteWater→Water, etc.)
@PART:HAS[@MODULE[ModuleResourceConverter]]:NEEDS[TacLifeSupport]:AFTER[TacLifeSupport]
{
  @MODULE[ModuleResourceConverter]
  {
    @OUTPUT_RESOURCE:HAS[#ResourceName[Oxygen],#ResourceName[Water]] {}
    @INPUT_RESOURCE,* { @Ratio *= 0.90 }
  }
}
