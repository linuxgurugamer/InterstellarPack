// Where warp should live in CTT
// Recommended nodes:
// 	experimentalScience
// 	exoticAlloys
// 	appliedHighEnergyPhysics
// These come after:
// 	Fusion reactors
// 	Advanced electric propulsion
// 	Large-scale power distribution
// ________________________________________
// Move Blueshift parts to late CTT nodes


// Gate Graviolium processing even deeper
// If you’re using Blueshift’s converters/refineries:

//	You can find Graviolium before warp
//	You can’t use it well until very late
@PART:HAS[@MODULE[WBIGravioliumConverter]]:NEEDS[NearFutureElectrical,NearFuturePropulsion,!InterstellarFuelSwitch]:AFTER[Blueshift]
{
  @TechRequired = experimentalScience
}

