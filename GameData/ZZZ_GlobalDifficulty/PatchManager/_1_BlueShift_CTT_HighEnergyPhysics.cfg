	patchName = HighEnergyPhysics
	srcPath = ZZZ_GlobalDifficulty/PatchManager/PluginData/Blueshift_CTT_HighEnergyPhysics.cfg
	shortDescr = 1. High Energy Physics

	// Optional, but recommended
