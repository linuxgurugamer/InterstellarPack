// GameData/ZZZ_Sterling_Tuning/11_ElectricsPhotoVoltaic_Tuning.cfg

// Put Sterling PV into late solar tier so it complements Near Future Solar rather than replacing it early.
@PART:HAS[@MODULE[ModuleDeployableSolarPanel]]:NEEDS[SterlingSystemsElectricsPhotoVoltaic,CommunityTechTree]:AFTER[SterlingSystemsElectricsPhotoVoltaic]
{
  @TechRequired = cuttingEdgeSolarTech
  @entryCost *= 1.25
}

