// GameData/ZZZ_Sterling_Tuning/40_EnginesAntimatter_Tuning.cfg

@PART:HAS[@MODULE[ModuleEngines*]]:NEEDS[SterlingSystemsEnginesAntimatter]:AFTER[SterlingSystemsEnginesAntimatter]
{
  @MODULE[ModuleEngines*]
  {
    @PROPELLANT[Antimatter] { @ratio *= 1.25 }
    @PROPELLANT[Positrons]  { @ratio *= 1.20 } // if present
    @PROPELLANT[ThermalPower] { @ratio *= 1.10 }
  }
}

