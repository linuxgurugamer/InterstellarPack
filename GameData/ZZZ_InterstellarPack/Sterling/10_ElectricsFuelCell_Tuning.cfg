// GameData/ZZZ_Sterling_Tuning/10_ElectricsFuelCell_Tuning.cfg

@PART:HAS[@MODULE[ModuleResourceConverter]]:NEEDS[SterlingSystemsElectricsFuelCell]:AFTER[SterlingSystemsElectricsFuelCell]
{
  @MODULE[ModuleResourceConverter]
  {
    // Only affect converters that output ElectricCharge
    @OUTPUT_RESOURCE:HAS[#ResourceName[ElectricCharge]] {}

    // Baseline: increase all inputs a bit (makes “free power” less free)
    @INPUT_RESOURCE,* { @Ratio *= 1.20 }

    // Engineer skill improves net efficiency (stock converter supports this)
    %UseSpecialistBonus = true
    %Specialty = Engineer
    %SpecialistEfficiencyFactor = 0.15
    %SpecialistBonusBase = 0.85
  }
}

