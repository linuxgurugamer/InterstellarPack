// GameData/ZZZ_Sterling_Tuning/30_EnginesFusion_Tuning.cfg

@PART:HAS[@MODULE[ModuleEngines*]]:NEEDS[SterlingSystemsEnginesFusion]:AFTER[SterlingSystemsEnginesFusion]
{
  @MODULE[ModuleEngines*]
  {
    @PROPELLANT[FusionPellets] { @ratio *= 1.35 }
    @PROPELLANT[ThermalPower]  { @ratio *= 1.10 }

    // Common CRP-ish cryo fuels sometimes appear alongside fusion pellets
    @PROPELLANT[LqdDeuterium]  { @ratio *= 1.15 }
    @PROPELLANT[LqdHe3]        { @ratio *= 1.15 }
    @PROPELLANT[Deuterium]     { @ratio *= 1.15 }
    @PROPELLANT[Helium3]       { @ratio *= 1.15 }
  }
}

