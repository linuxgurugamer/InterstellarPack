// GameData/ZZZ_Sterling_Tuning/20_EnginesFission_Tuning.cfg

@PART:HAS[@MODULE[ModuleEngines*]]:NEEDS[SterlingSystemsEnginesFission]:AFTER[SterlingSystemsEnginesFission]
{
  @MODULE[ModuleEngines*]
  {
    // If the engine consumes ThermalPower directly, raise it slightly.
    @PROPELLANT[ThermalPower] { @ratio *= 1.15 }

    // If it uses liquid hydrogen or similar, modest bump.
    @PROPELLANT[LqdHydrogen]  { @ratio *= 1.05 }
    @PROPELLANT[Hydrogen]     { @ratio *= 1.05 }
  }
}

