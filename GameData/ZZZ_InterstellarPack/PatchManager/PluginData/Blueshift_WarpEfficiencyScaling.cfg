// Encourage proper interstellar vessels, not tiny sleds.
//
//	Stations & colony ships warp efficiently
//	“FTL probes” are slow and wasteful
@PART:HAS[@MODULE[WBIWarpEngine]]NEEDS[NearFutureElectrical,NearFuturePropulsion,!InterstellarFuelSwitch]::AFTER[Blueshift]
{
  @MODULE[WBIWarpEngine]
  {
    %efficiencyCurve
    {
      key = 100   0.15
      key = 300   0.35
      key = 800   0.65
      key = 1500  1.0
    }
  }
}

