//	warp to be sector-based instead of "jump anywhere"
// Encourages:
//	Staging bases
//	Forward colonies
//	Interstellar infrastructure chains

@PART:HAS[@MODULE[WBIWarpEngine]]NEEDS[NearFutureElectrical,NearFuturePropulsion,!InterstellarFuelSwitch]::AFTER[Blueshift]
{
  @MODULE[WBIWarpEngine]
  {
    %maxWarpRange = 25000000000000  // ~2.5 ly scale equivalent
  }
}

