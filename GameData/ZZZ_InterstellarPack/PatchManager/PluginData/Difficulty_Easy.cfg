// GameData/ZZZ_InterstellarPack/Extras/Difficulty_Easy.cfg.txt
@PART:HAS[@MODULE[WBIWarpEngine]]:NEEDS[Blueshift]:AFTER[Blueshift]
{
  @MODULE[WBIWarpEngine]
  {
    // Cheaper warp
    @gravioliumConsumptionRate *= 0.65
    @startupCost *= 0.75

    // Allow smaller craft to dabble
    %minimumWarpMass = 40

    // Crew helps more
    @warpSpeedSkillMultiplier *= 1.5
  }
}

// Easier logistics: lower input costs on Sterling converters & slightly lower high-end propellant burn

@PART:HAS[@MODULE[ModuleResourceConverter]]:NEEDS[SterlingSystemsElectricsFuelCell|SterlingSystemsElectricsPhotoVoltaic]:AFTER[SterlingSystemsElectricsFuelCell]
{
  @MODULE[ModuleResourceConverter]
  {
    @OUTPUT_RESOURCE:HAS[#ResourceName[ElectricCharge]] {}
    @INPUT_RESOURCE,* { @Ratio *= 0.90 }
    @SpecialistEfficiencyFactor *= 1.25
    @SpecialistBonusBase = 0.92
  }
}

@PART:HAS[@MODULE[ModuleEngines*]]:NEEDS[SterlingSystemsEnginesFusion|SterlingSystemsEnginesAntimatter]:AFTER[SterlingSystemsEnginesFusion]
{
  @MODULE[ModuleEngines*]
  {
    @PROPELLANT[FusionPellets] { @ratio *= 0.90 }
    @PROPELLANT[Antimatter]    { @ratio *= 0.90 }
  }
}
