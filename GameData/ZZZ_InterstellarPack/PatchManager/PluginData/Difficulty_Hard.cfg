// GameData/ZZZ_InterstellarPack/Extras/Difficulty_Hard.cfg.txt
@PART:HAS[@MODULE[WBIWarpEngine]]:NEEDS[Blueshift]:AFTER[Blueshift]
{
  @MODULE[WBIWarpEngine]
  {
    // Expensive warp: forces infrastructure and reactor-scale ships
    @gravioliumConsumptionRate *= 2.5
    @startupCost *= 3.0
    %minimumWarpMass = 300

    // Crew still matters, but less “magical”
    @warpSpeedSkillMultiplier *= 0.8
  }
}

// Hard logistics: higher input costs and higher rare-fuel burn

@PART:HAS[@MODULE[ModuleResourceConverter]]:NEEDS[SterlingSystemsElectricsFuelCell|SterlingSystemsElectricsPhotoVoltaic]:AFTER[SterlingSystemsElectricsFuelCell]
{
  @MODULE[ModuleResourceConverter]
  {
    @OUTPUT_RESOURCE:HAS[#ResourceName[ElectricCharge]] {}
    @INPUT_RESOURCE,* { @Ratio *= 1.15 }
    @SpecialistEfficiencyFactor *= 0.85
    @SpecialistBonusBase = 0.80
  }
}

@PART:HAS[@MODULE[ModuleEngines*]]:NEEDS[SterlingSystemsEnginesFusion|SterlingSystemsEnginesAntimatter]:AFTER[SterlingSystemsEnginesFusion]
{
  @MODULE[ModuleEngines*]
  {
    @PROPELLANT[FusionPellets] { @ratio *= 1.15 }
    @PROPELLANT[Antimatter]    { @ratio *= 1.20 }
  }
}

@PART:HAS[@MODULE[ModuleEngines*]]:NEEDS[SterlingSystemsEnginesFission|SterlingSystemsEnginesThermalNozzle]:AFTER[SterlingSystemsEnginesFission]
{
  @MODULE[ModuleEngines*]
  {
    @PROPELLANT[ThermalPower] { @ratio *= 1.10 }
  }
}
