// Ties warp performance to Engineer skill using Blueshift’s own parameters (warpEngineerSkill, warpSpeedBoostRank, warpSpeedSkillMultiplier). 
//
// GameData/ZZZ_InterstellarPack/02_CrewSkill_WarpBonus.cfg

@PART:HAS[@MODULE[WBIWarpEngine]]:NEEDS[Blueshift]:AFTER[Blueshift]
{
  @MODULE[WBIWarpEngine]
  {
    // Which trait affects warp performance
    %warpEngineerSkill = Engineer

    // Rank required to get the full "boost" behavior (common default is 5)
    %warpSpeedBoostRank = 5

    // How much warp speed scaling you get per star (tune this to taste)
    // Example: 0.02 => ~2% per engineering star effect (overall behavior depends on Blueshift internals)
    %warpSpeedSkillMultiplier = 0.02
  }
}

